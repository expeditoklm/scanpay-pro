name: tpe_qr_saas
description: Application SaaS vente par QR pour TPE (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  crypto: ^3.0.6
  image_picker: ^1.1.2
  google_mlkit_commons: ^0.8.1
  google_mlkit_image_labeling: ^0.12.0
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  permission_handler: ^11.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  print_bluetooth_thermal: ^1.1.2
  path_provider: ^2.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  csv: ^8.0.0
  file_picker: ^8.1.2
  excel: ^4.0.6
  connectivity_plus: ^6.1.1
  vibration: ^3.1.8
  app_settings: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"  # couleur de fond
  adaptive_icon_foreground: "assets/icon/app-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-logo.png
    - assets/onboarding/
